name: Install with LabelFirst
description: Python with the base and similarity locks plus the pinned private LabelFirst checkout.
inputs:
  ssh-key:
    description: Private half of a read-only traitlab/labelfirst deploy key
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: |
          requirements.lock
          requirements-similarity.lock
    - name: Resolve LabelFirst revision
      id: labelfirst
      shell: bash
      env:
        LABELFIRST_DEPLOY_KEY: ${{ inputs.ssh-key }}
      run: |
        if [ -z "$LABELFIRST_DEPLOY_KEY" ]; then
          echo '::error::LABELFIRST_DEPLOY_KEY must be the private half of a read-only traitlab/labelfirst deploy key.'
          exit 1
        fi
        python - <<'PYTHON' >> "$GITHUB_OUTPUT"
        import tomllib
        with open("pyproject.toml", "rb") as stream:
            config = tomllib.load(stream)
        requirement, = config["project"]["optional-dependencies"]["similarity"]
        print("revision=" + requirement.rsplit("@", 1)[1])
        PYTHON
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: traitlab/labelfirst
        ref: ${{ steps.labelfirst.outputs.revision }}
        path: .integration/labelfirst
        ssh-key: ${{ inputs.ssh-key }}
        persist-credentials: false
    # The small optional lock adds only packages absent from the base lock. Installing
    # together prevents optional dependencies from silently replacing tested base pins.
    - shell: bash
      run: pip install --require-hashes -r requirements.lock -r requirements-similarity.lock
    - shell: bash
      run: pip install --no-deps -e .integration/labelfirst
    - shell: bash
      run: pip check
