name: labelfirst consumer integration

# Base CI intentionally has no private dependencies. This runs the full suite with the real
# LabelFirst on every push where LABELFIRST_DEPLOY_KEY is set, and skips where it is not
# (fork pull requests get no secrets). The key is a dedicated read-only deploy key for
# traitlab/labelfirst, used only by checkout and not persisted in git config.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    env:
      HAS_KEY: ${{ secrets.LABELFIRST_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: env.HAS_KEY == 'true'
        uses: ./.github/actions/labelfirst
        with:
          ssh-key: ${{ secrets.LABELFIRST_DEPLOY_KEY }}
      - name: Test the consumer with the real optional dependency
        if: env.HAS_KEY == 'true'
        env:
          PYTHONPATH: src
        run: python -m pytest -m 'not network'
