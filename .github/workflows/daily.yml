name: daily

# Rebuilds the rotation page every evening (UTC), once the atlas job has embedded the day's records, from the day's BC needs-ID pool and keeps it as
# study.html on the pool-state release. It does not deploy: map.yml runs after it and is the
# only workflow that publishes the full site, taking study.html from the release.
# The steps live in scripts/daily.sh so a laptop can run exactly the same build.
# The repository is public, so nothing here may print or upload the list key or anything that
# maps list letters to lists: the only files kept are the pool, the served log (letters only),
# and each day's pool and public build record, as assets on the pool-state release. out/ holds
# the manifest with the map and is never uploaded.
on:
  schedule:
    - cron: "17 22 * * *" # after the atlas job, which finishes by about 20:30 UTC; 15:17 in Vancouver in summer time
  workflow_dispatch:
    inputs:
      full_pull:
        description: "Pull the whole pool (hours) instead of the records created since the last run"
        type: boolean
        default: false

permissions:
  contents: read

# Shared with the other workflows so the builds never race.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  D1: "2025-01-01" # earliest observed_on in the pool
  STATE_TAG: pool-state
  WHAT_TO_ID_USER_AGENT: what-to-id daily build (https://github.com/PollockLab/what-to-id)

jobs:
  # The first day's whole pool takes hours, so it gets its own job and its own time limit.
  # On later days the release already holds the pool and this job only checks that.
  pull:
    # The schedule stays off until the repository variable DAILY_ENABLED is "true".
    if: github.event_name == 'workflow_dispatch' || vars.DAILY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    outputs:
      today: ${{ steps.today.outputs.today }}
    env:
      GH_TOKEN: ${{ github.token }}
      FULL_PULL: ${{ inputs.full_pull }}
      TIME: "%C took %e s, peak %M KB"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.CODE_REF || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      # One build date for both jobs, even if the pull crosses midnight UTC.
      - id: today
        run: |
          echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "TODAY=$(date -u +%F)" >> "$GITHUB_ENV"
      # A pull cut short (the time limit, an iNaturalist outage) resumes on the next run.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/pool.parquet.parts
          key: daily-pull-parts-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: daily-pull-parts-
      - run: /usr/bin/time scripts/daily.sh pull
        timeout-minutes: 330 # leaves the job time to save the checkpoints
      - if: always() && hashFiles('state/pool.parquet.parts/params.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/pool.parquet.parts
          key: daily-pull-parts-${{ github.run_id }}-${{ github.run_attempt }}

  build:
    needs: pull
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TODAY: ${{ needs.pull.outputs.today }}
      BLITZ_D1: ${{ vars.BLITZ_D1 || '2026-11-01' }}
      WTB_DIR: wtb/cluster_results/ca
      ARMS: recency,gap_first,similarity,novelty
      EMBEDDING_RELEASE: ${{ vars.EMBEDDING_RELEASE || 'embedding-base-2026-10-15' }}
      EMBEDDING_REPO: ${{ vars.EMBEDDING_REPO || github.repository }}
      EMBEDDING_BUNDLE: data/embedding-bundle
      TIME: "%C took %e s, peak %M KB" # format for /usr/bin/time on each daily.sh step
    steps:
      # CODE_REF (a tag such as blitz-bc-2026) pins the code for the whole blitz; unset, the
      # job runs the commit that triggered it. Either way the build record names the commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.CODE_REF || github.sha }}
      - uses: ./.github/actions/labelfirst
        with:
          ssh-key: ${{ secrets.LABELFIRST_DEPLOY_KEY }}
      - name: Verify the real LabelFirst integration
        env:
          PYTHONPATH: src
        run: python -m pytest -m labelfirst tests/test_labelfirst_integration.py
      - name: Read the where-to-blitz commit the code expects
        id: wtb
        run: |
          sha=$(PYTHONPATH=src python -c "from what_to_id.manifest import WHERE_TO_BLITZ_REF as r; print(r.split('@')[1])")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PollockLab/where-to-blitz
          ref: ${{ steps.wtb.outputs.sha }}
          path: wtb
          sparse-checkout: cluster_results/ca
      - name: Check the list key is set
        env:
          WHAT_TO_ID_KEY: ${{ secrets.WHAT_TO_ID_KEY }}
        run: |
          if [ -z "$WHAT_TO_ID_KEY" ]; then
            echo "::error::Repository secret WHAT_TO_ID_KEY is not set; run the setup wizard"
            exit 1
          fi
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - run: /usr/bin/time scripts/daily.sh fetch
      - name: Assemble today's embedding bundle from the base release and the atlas deltas
        run: /usr/bin/time scripts/daily.sh fetch-embeddings
      - name: Build, check for leaks, replay
        env:
          WHAT_TO_ID_KEY: ${{ secrets.WHAT_TO_ID_KEY }}
        run: /usr/bin/time scripts/daily.sh build
      - run: /usr/bin/time scripts/daily.sh save
      # The job limit is 350 minutes: warn well before the blitz's growing pool reaches it.
      - name: Warn when the run nears the job limit
        if: always()
        run: |
          [ -n "${JOB_START:-}" ] || exit 0
          minutes=$(( ($(date +%s) - JOB_START) / 60 ))
          echo "daily: job ran $minutes minutes"
          if [ "$minutes" -ge 240 ]; then
            echo "::warning::The daily job ran $minutes minutes, past the 4-hour bar; the limit is 350."
          fi
