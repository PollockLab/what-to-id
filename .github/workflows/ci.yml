name: ci

# Tests and lint on every push and pull request, with the same locked dependencies the daily
# build installs, so the code the daily job runs has passed here first.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - run: python -m pytest -q
        env:
          PYTHONPATH: src
      - run: ruff check src tests && ruff format --check src tests
      - run: bash -n scripts/daily.sh && shellcheck scripts/daily.sh
