name: ci

# Tests and lint on every push and pull request, with the same locked dependencies the daily
# build installs, so the code the daily job runs has passed here first.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - run: python -m pytest -q
        env:
          PYTHONPATH: src
      - run: ruff check src tests && ruff format --check src tests
      - run: bash -n scripts/daily.sh && shellcheck scripts/daily.sh

  viewer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-atlas.lock
            requirements-browser.lock
      - run: pip install --require-hashes -r requirements.lock -r requirements-atlas.lock -r requirements-browser.lock
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_embeddings_browser.py tests/test_split_subsets_browser.py tests/test_atlas_search_browser.py tests/test_embeddings_layout_js.py
        env:
          PYTHONPATH: src
          WHAT_TO_ID_REQUIRE_BROWSER: "1"
