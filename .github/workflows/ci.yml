name: ci

# Tests and lint on every push and pull request, with the same locked dependencies the daily
# build installs, so the code the daily job runs has passed here first.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - run: python -m pytest -q
        env:
          PYTHONPATH: src
      - run: ruff check src tests && ruff format --check src tests
      - run: bash -n scripts/daily.sh && shellcheck scripts/daily.sh

  viewer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-atlas.lock
            requirements-browser.lock
      - run: pip install --require-hashes -r requirements.lock -r requirements-atlas.lock -r requirements-browser.lock
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_embedding_atlas_browser.py tests/test_atlas_projection.py tests/test_embedding_atlas.py tests/test_embedding_atlas_js.py
        env:
          PYTHONPATH: src
          WHAT_TO_ID_REQUIRE_BROWSER: "1"

  # Exercise the raw log boundary with the same read-only workflow token as Pages.
  pages-api:
    if: github.event_name == 'pull_request' && github.repository == 'PollockLab/what-to-id'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Capture current map job logs with the workflow token
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          python3 - <<'PYTHON'
          import sys
          from what_to_id.demo_publication import PublicationError, _api
          try:
              repository = "repos/PollockLab/what-to-id"
              runs = _api(f"{repository}/actions/workflows/map.yml/runs?status=success&per_page=1")
              if not runs["workflow_runs"]:
                  raise PublicationError("No successful map run available for log transport check")
              run_id = runs["workflow_runs"][0]["id"]
              jobs = _api(f"{repository}/actions/runs/{run_id}/jobs?per_page=100")["jobs"]
              refresh = [job for job in jobs if job["name"] == "refresh" and job["conclusion"] == "success"]
              if len(refresh) != 1:
                  raise PublicationError("Expected one successful map refresh job")
              logs = _api(f"{repository}/actions/jobs/{refresh[0]['id']}/logs", raw=True)
              if not logs:
                  raise PublicationError("Map job log download returned an empty response")
          except PublicationError as exc:
              sys.exit(str(exc))
          print(f"Workflow token captured current map job logs (ANSI present: {bytes([27]) in logs})")
          PYTHON
