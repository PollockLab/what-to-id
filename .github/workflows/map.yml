name: map

# Refreshes the map of records that need an ID (site/map.html and its pool*.bin files) every morning while
# the daily study build is off; once DAILY_ENABLED is "true" that build writes the map itself and
# this job stands down. It keeps its own pool on the map-state release, apart from the study's
# pool-state, so it never changes what the study serves.
#
# Each run asks for every BC record iNaturalist updated since the last run, in any quality grade
# and any group, and brings the pool in line: needs-ID records with a photo are added or
# replaced, the rest are dropped. So new uploads, records reaching or dropping back from Research
# Grade, reopened casual records and changed IDs all arrive. The next run starts from the newest
# update seen, saved in sync.json with the run's counts. The daily query cannot see records
# deleted from iNaturalist, moved out of BC or redated, so each run also reconciles the pool by
# id-range counts, dropping what iNaturalist no longer holds, and warns if the pool's size still
# drifts from iNaturalist's count.
#
# The build also fetches iNaturalist's monthly count of every BC record with a photo, needing an ID or
# Research Grade, per group and date (about 28 requests), so the map can show the share still
# needing an ID. If that fetch fails the map ships without it.
#
# Seed once: upload pool.parquet and sync.json to a release tagged map-state (sync.json holds the
# since cursor, so the repository variable MAP_SINCE is only needed when there is no sync.json),
# then set the repository variable MAP_DAILY_ENABLED to "true".
on:
  schedule:
    - cron: "47 13 * * *" # 30 minutes after the daily study build's slot
  workflow_dispatch:

permissions:
  contents: read

# Shared with pages.yml and daily.yml so two deploys never race.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  D1: "1900-01-01" # all of iNaturalist; the earliest BC needs-ID record is from 1949
  STATE_TAG: map-state
  MAP_SINCE: ${{ vars.MAP_SINCE }} # read only while sync.json does not exist yet
  WHAT_TO_ID_USER_AGENT: what-to-id map refresh (https://github.com/PollockLab/what-to-id)

jobs:
  refresh:
    if: >-
      vars.DAILY_ENABLED != 'true' &&
      (github.event_name == 'workflow_dispatch' || vars.MAP_DAILY_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - name: Fetch the map pool
        run: |
          set -euo pipefail
          mkdir -p state
          gh release download "$STATE_TAG" -D state -p pool.parquet --clobber || true
          test -s state/pool.parquet || { echo "::error::no pool.parquet on the $STATE_TAG release; seed it first"; exit 1; }
          # a missing sync.json would restart from MAP_SINCE, so only allow that on the first run
          if ! gh release download "$STATE_TAG" -D state -p sync.json --clobber && [ -z "${MAP_SINCE:-}" ]; then
            echo "::error::sync.json did not download and MAP_SINCE is empty; refusing to restart the sync from scratch"; exit 1
          fi
      - name: Apply every change since the last run
        run: |
          set -euo pipefail
          python -m what_to_id.pool_state sync --pool state/pool.parquet --state state/sync.json \
            --since "$MAP_SINCE" --d1 "$D1"
      - name: Drop records iNaturalist no longer holds
        id: reconcile
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m what_to_id.pool_state reconcile --pool state/pool.parquet --state state/sync.json \
            --d1 "$D1"
      - name: Warn that the reconcile failed
        if: steps.reconcile.outcome == 'failure'
        run: echo "::warning::reconcile failed; deploying the synced pool without it"
      - name: Build the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp site/*.html _site/
          python -m what_to_id.page_map --pool state/pool.parquet --out _site --totals --freeze "$(date -u +%F)"
          if find _site -type f ! -name '*.html' ! -name 'pool*.bin' | grep -q .; then
            echo "::error::the site must hold only HTML pages and the map's pool*.bin files"; exit 1
          fi
          if grep -ril -E 'recency|gap_first|gap first|similarity|novelty|surprise' _site; then
            echo "::error::a list name leaked into the site"; exit 1
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Save the map pool
        run: |
          set -euo pipefail
          # the pool first, so the cursor never moves past a pool that failed to upload
          gh release upload "$STATE_TAG" state/pool.parquet --clobber
          gh release upload "$STATE_TAG" state/sync.json --clobber
