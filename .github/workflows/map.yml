name: map

# Refreshes the map of records that need an ID (site/map.html and its pool*.bin files) every morning
# and is the only workflow that publishes the full site: the landing page (index.html, a copy of
# the levels page, else Explore), the map, the photo pages, and the study page. The study page is the committed site/study.html,
# or, once the repository variable DAILY_ENABLED is "true", the study.html that daily.yml saves
# on the pool-state release. It runs on its own schedule and again after each successful daily
# run, so a new study page goes live without waiting. It keeps its own pool on the map-state release, apart from the study's
# pool-state, so it never changes what the study serves.
#
# Each run asks for every BC record iNaturalist updated since the last run, in any quality grade
# and any group, and brings the pool in line: needs-ID records with a photo are added or
# replaced, the rest are dropped. So new uploads, records reaching or dropping back from Research
# Grade, reopened casual records and changed IDs all arrive. The next run starts from the newest
# update seen, saved in sync.json with the run's counts. The daily query cannot see records
# deleted from iNaturalist, moved out of BC or redated, so each run also reconciles the pool by
# id-range counts, dropping what iNaturalist no longer holds, and warns if the pool's size still
# drifts from iNaturalist's count.
#
# The build also fetches iNaturalist's monthly count of every BC record with a photo, needing an ID or
# Research Grade, per group and date, and again under each status filter (about 112 requests), so the
# map can show the share still needing an ID. If that fetch fails the map ships without it.
#
# The map's clade filters read the taxon tree, kept as taxonomy.json on the same release. Each run
# asks iNaturalist only for taxa the tree lacks and their ancestors (the first run fills it in a few
# hundred requests, later runs in a handful). If that fails the map ships with the tree it has, and
# hides the clade chips while some of the pool's taxa lack their ancestors.
#
# It also keeps, in projects.bin on the release, which pool records sit in each project of
# map_projects.PROJECTS, so the map can combine them. A project is listed in full once, then kept
# up to date from the day's updates and an id-range count check. If that step fails the map ships
# with the last lists, and without project filters when there are none. A big project (the BC
# Biodiversity Program) is over the per-run cap, so seed it once from a local run of
# `python -m what_to_id.map_projects --max-requests 4000` and upload the file as projects.bin.
#
# Seed once: upload pool.parquet and sync.json to a release tagged map-state (sync.json holds the
# since cursor, so the repository variable MAP_SINCE is only needed when there is no sync.json),
# then set the repository variable MAP_DAILY_ENABLED to "true".
on:
  schedule:
    - cron: "47 13 * * *" # morning refresh of the map; the study page follows each daily run through workflow_run below
  workflow_run:
    workflows: [daily]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Shared with pages.yml and daily.yml so the builds and the deploy never race.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  D1: "1900-01-01" # all of iNaturalist; the earliest BC needs-ID record is from 1949
  STATE_TAG: map-state
  MAP_SINCE: ${{ vars.MAP_SINCE }} # read only while sync.json does not exist yet
  WHAT_TO_ID_USER_AGENT: what-to-id map refresh (https://github.com/PollockLab/what-to-id)

jobs:
  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && vars.DAILY_ENABLED == 'true') ||
      (github.event_name == 'schedule' && vars.MAP_DAILY_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - name: Fetch the map pool
        run: |
          set -euo pipefail
          mkdir -p state
          gh release download "$STATE_TAG" -D state -p pool.parquet --clobber || true
          gh release download "$STATE_TAG" -D state -p taxonomy.json --clobber || echo "no taxonomy.json yet; this run starts it"
          test -s state/pool.parquet || { echo "::error::no pool.parquet on the $STATE_TAG release; seed it first"; exit 1; }
          # a missing sync.json would restart from MAP_SINCE, so only allow that on the first run
          if ! gh release download "$STATE_TAG" -D state -p sync.json --clobber && [ -z "${MAP_SINCE:-}" ]; then
            echo "::error::sync.json did not download and MAP_SINCE is empty; refusing to restart the sync from scratch"; exit 1
          fi
          gh release download "$STATE_TAG" -D state -p projects.bin --clobber || echo "no projects.bin yet; this run starts it"
      - name: Apply every change since the last run
        run: |
          set -euo pipefail
          python -m what_to_id.pool_state sync --pool state/pool.parquet --state state/sync.json \
            --since "$MAP_SINCE" --d1 "$D1"
      - name: Drop records iNaturalist no longer holds
        id: reconcile
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m what_to_id.pool_state reconcile --pool state/pool.parquet --state state/sync.json \
            --d1 "$D1"
      - name: Warn that the reconcile failed
        if: steps.reconcile.outcome == 'failure'
        run: echo "::warning::reconcile failed; deploying the synced pool without it"
      - name: Add new taxa to the taxon tree
        id: tree
        continue-on-error: true
        run: python -m what_to_id.taxonomy --pool state/pool.parquet --tree state/taxonomy.json
      - name: Warn that the tree update failed
        if: steps.tree.outcome == 'failure'
        run: echo "::warning::taxon tree update failed; building with the tree as it was"
      - name: Update the project lists
        id: projects
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m what_to_id.map_projects --pool state/pool.parquet --state state/projects.bin \
            --d1 "$D1"
      - name: Warn that the project lists did not update
        if: steps.projects.outcome == 'failure'
        run: echo "::warning::project lists did not update; the map uses the last ones, if any"
      - name: Build the site
        env:
          DAILY_ENABLED: ${{ vars.DAILY_ENABLED }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp site/*.html _site/
          # the daily build's study page replaces the committed one only while the daily build is on
          if [ "$DAILY_ENABLED" = true ]; then
            gh release download pool-state -p study.html -D _site --clobber
          fi
          python -m what_to_id.page_map --pool state/pool.parquet --out _site --totals --freeze "$(date -u +%F)" \
            --tree state/taxonomy.json \
            --projects state/projects.bin
          # the tree of life needs the taxon tree; without it the site ships without the Tree tab
          python -m what_to_id.tree_page --out _site || echo "::warning::no tree of life page; the map was built without its taxon tree"
          if find _site -type f ! -name '*.html' ! -name 'pool*.bin' ! -name bc-parks.bin | grep -q .; then
            echo "::error::the site must hold only HTML pages, the map's pool*.bin files and its bc-parks.bin"; exit 1
          fi
          if grep -ril -E 'recency|gap_first|gap first|similarity|novelty|surprise' _site; then
            echo "::error::a list name leaked into the site"; exit 1
          fi
      # pool-lookalike.bin: per-record agreement and nearest other-taxon rank from the photo-space
      # neighbours on the index repo, pairs photographed together skipped. The photo-space page works without it.
      - name: Add the look-alike stats
        id: lookalike
        continue-on-error: true
        env:
          ATLAS_HF_REPO: ${{ vars.ATLAS_HF_REPO }}
        run: |
          set -euo pipefail
          if [ -z "$ATLAS_HF_REPO" ]; then echo "no ATLAS_HF_REPO; no look-alike stats"; exit 0; fi
          python -m what_to_id.page_lookalike --out _site \
            --data-url "https://huggingface.co/datasets/${ATLAS_HF_REPO}/resolve/main/"
      - name: Warn that the look-alike stats failed
        if: steps.lookalike.outcome == 'failure'
        run: echo "::warning::no look-alike stats; the photo-space page ships without them"
      # confusion.html: per species, the species its photos most often look like, from the small parquet
      # beside the atlas index. The tree card links to it through confusion-taxa.json.
      - name: Add the confused pairs page
        continue-on-error: true
        env:
          ATLAS_HF_REPO: ${{ vars.ATLAS_HF_REPO }}
        run: |
          set -euo pipefail
          if [ -z "$ATLAS_HF_REPO" ]; then echo "no ATLAS_HF_REPO; no confused pairs page"; exit 0; fi
          python -m what_to_id.page_confusion --out _site \
            --data-url "https://huggingface.co/datasets/${ATLAS_HF_REPO}/resolve/main/"
      # levels.html: Needs ID records at three levels, from levels.parquet beside the atlas index,
      # less those the synced pool shows identified since.
      # Before the photo-search page, whose Explore bar links to it once it exists.
      - name: Add the levels page
        continue-on-error: true
        env:
          ATLAS_HF_REPO: ${{ vars.ATLAS_HF_REPO }}
        run: |
          set -euo pipefail
          if [ -z "$ATLAS_HF_REPO" ]; then echo "no ATLAS_HF_REPO; no levels page"; exit 0; fi
          python -m what_to_id.page_levels --out _site \
            --data-url "https://huggingface.co/datasets/${ATLAS_HF_REPO}/resolve/main/" \
            --pool state/pool.parquet
      - name: Include the photo-search page
        env:
          ATLAS_HF_REPO: ${{ vars.ATLAS_HF_REPO }}
        run: scripts/atlas_page.sh _site
      # The root opens Identify, the levels page, or else Explore, or the map when the site was built
      # without the photo space.
      - name: Write the landing page
        run: |
          for p in levels explore map; do if [ -f "_site/$p.html" ]; then cp "_site/$p.html" _site/index.html; break; fi; done
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Save the map pool
        run: |
          set -euo pipefail
          # the pool first, so the cursor never moves past a pool that failed to upload
          gh release upload "$STATE_TAG" state/pool.parquet --clobber
          gh release upload "$STATE_TAG" state/sync.json --clobber
          if [ -s state/taxonomy.json ]; then
            gh release upload "$STATE_TAG" state/taxonomy.json --clobber || echo "::warning::could not save taxonomy.json"
          fi
          if [ -s state/projects.bin ]; then
            gh release upload "$STATE_TAG" state/projects.bin --clobber || echo "::warning::could not save projects.bin"
          fi
