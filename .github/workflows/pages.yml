name: pages

# Publishes site/ (a built what-to-id page, copied from out/<build>/site) to GitHub Pages.
# The build itself runs off-CI because it needs the frozen pool and image embeddings; the
# manifest with the arm map and the seed never enters site/.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Once the daily build is on, a push to site/ would overwrite its page until the next
    # morning, so only a manual run deploys site/.
    if: github.event_name == 'workflow_dispatch' || vars.DAILY_ENABLED != 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the site is present and blinded
        run: |
          set -euo pipefail
          test -s site/index.html
          if find site -type f ! -name '*.html' | grep -q .; then
            echo "site/ must hold only HTML pages"; find site -type f ! -name '*.html'; exit 1
          fi
          if grep -ril -E 'recency|gap_first|gap first|similarity|novelty' site; then
            echo "an arm name leaked into site/"; exit 1
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
