name: pages

# Keeps the live site current when site/ changes on main. map.yml is the one workflow that
# publishes the full site, from site/ (a built what-to-id page, copied from out/<build>/site) plus
# its own refresh, so a push that changes site/ or a manual run here just starts map.yml. The study
# build runs off-CI or in daily.yml because it needs the frozen pool and image embeddings; the
# manifest with the arm map and the seed never enters site/.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  handoff:
    if: github.event_name == 'workflow_dispatch' || vars.MAP_DAILY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh workflow run map.yml --repo "$GITHUB_REPOSITORY" --ref main
