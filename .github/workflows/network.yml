name: network

# Tests marked `network` (live iNaturalist API, MapLibre and deck.gl from a CDN) are deselected
# in pytest addopts and in ci.yml, so run them nightly to catch rot. Setup mirrors ci.yml's viewer job.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-atlas.lock
            requirements-browser.lock
      - run: pip install --require-hashes -r requirements.lock -r requirements-atlas.lock -r requirements-browser.lock
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q -m network
        env:
          PYTHONPATH: src
          WHAT_TO_ID_REQUIRE_BROWSER: "1"
