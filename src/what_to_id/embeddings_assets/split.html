<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explore: map and photo space</title>
<style>
__SITE_CSS__
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column}
.site-shell{flex-wrap:wrap;position:relative}
.site-nav{flex:0 1 auto}
.xbar{display:flex;align-items:center;gap:8px 14px;margin-left:auto;min-width:0;font-size:13px;white-space:nowrap}
.counts{color:var(--muted)}
.counts b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
#sf{position:relative;display:inline-flex;gap:6px;flex:0 1 auto;min-width:0}
#sg{position:absolute;left:0;top:100%;z-index:40;width:max(100%,320px);max-width:calc(100vw - 24px);margin:4px 0 0;padding:4px 0;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);white-space:normal}
#sg[hidden]{display:none}
#sg li{padding:6px 10px;cursor:pointer;min-height:36px}
#sg li span{display:block;color:var(--muted);font-size:12px}
#sg li i{float:right;margin-left:8px;font-style:normal;font-size:11px;color:var(--muted)}
#sg li[aria-selected="true"]{background:var(--chip)}
#sq{font:inherit;font-size:13px;width:min(230px,30vw);min-width:120px;flex:0 1 auto;min-height:28px;padding:0 10px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink)}
#sf button{font:inherit;font-size:12px;min-height:28px;padding:0 11px;border:1px solid var(--line);border-radius:14px;background:var(--chip);color:var(--ink);cursor:pointer}
.seg{display:inline-flex}
.seg button,.xbar .i{font:inherit;font-size:12px;min-height:28px;padding:0 11px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.seg button{touch-action:none}
.seg button.dr{position:relative;z-index:2;box-shadow:var(--shadow);cursor:grabbing}
.seg button:first-child{border-radius:14px 0 0 14px}
.seg button:last-child{border-radius:0 14px 14px 0}
.seg button+button{border-left:0}
.seg button[aria-pressed="true"]{background:var(--on);color:var(--onink);border-color:var(--on);font-weight:650}
.seg button[aria-pressed="true"]+button[aria-pressed="true"]{border-left:1px solid var(--bg)}  /* shown panes stay told apart */
.xbar .i{border-radius:50%;width:28px;padding:0;font-style:italic;font-weight:700;font-family:Georgia,serif}
.note{position:absolute;z-index:30;top:100%;right:16px;width:min(380px,calc(100vw - 24px));margin:6px 0 0;padding:10px 12px;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);font-size:12px;color:var(--muted);white-space:normal}
.note[hidden]{display:none}
#main-content{flex:1 1 0;min-height:0;display:flex;overflow-x:auto;margin-bottom:calc(56px + env(safe-area-inset-bottom,0px))}  /* the state bar's band: it covers no pane's controls */
#main-content iframe{flex:1 1 0;min-width:0;height:100%;border:0;background:var(--bg)}
#main-content iframe[hidden]{display:none}
#main-content #identify{min-width:280px}
#main-content #map,#main-content #space{min-width:320px}
/* the map's frame as the filter rail alone, the map pane hidden (map_rail.js); on a phone a sheet */
#main-content #map.rail{min-width:0;border-right:1px solid var(--line)}
/* with the map pane hidden, the map's frame as the state bar's sheet (state_bar.js), above the bar */
#main-content #map.sheet{position:fixed;left:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));width:100%;z-index:20;max-height:60vh;box-shadow:var(--shadow);border-top:1px solid var(--line)}
/* the state bar: the count, the selection's chips and the Legend and Filters buttons, over every pane */
.sbar{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:6px;max-width:92vw;padding:4px;background:var(--panel);border:1px solid var(--line);
  border-radius:20px;box-shadow:var(--shadow);font-size:12px;white-space:nowrap}
.sbn{padding:0 4px 0 8px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.sbn:empty{display:none}
.sbc{display:flex;gap:4px;margin:0;padding:0;list-style:none;min-width:0;overflow-x:auto;scrollbar-width:none}
.sbc:empty{display:none}
.sbc li{display:inline-flex;align-items:center;flex:none;min-height:28px;padding:0 2px 0 10px;border-radius:14px;background:var(--chip);color:var(--ink)}
.sbc button{width:24px;height:24px;padding:0;border:0;border-radius:50%;background:none;color:var(--muted);font:inherit;font-size:14px;cursor:pointer}
.sbc button:hover{color:var(--ink);background:var(--line)}
.sbar>button{flex:none;font:inherit;font-size:12px;min-height:28px;padding:0 12px;border:1px solid var(--line);border-radius:14px;background:var(--chip);color:var(--ink);cursor:pointer}
.sbar>button[aria-expanded="true"]{background:var(--on);color:var(--onink);border-color:var(--on);font-weight:650}
#main-content #tree{min-width:260px}
#main-content.drag iframe{pointer-events:none}
.sep{position:relative;z-index:1;flex:0 0 7px;cursor:col-resize;background:var(--line);touch-action:none;outline-offset:-2px}
.sep::before{content:'';position:absolute;top:0;bottom:0;left:-8px;right:-8px}  /* a 23 px target for a finger, the line stays 7 px */
.sep:hover,.sep:focus-visible,.sep.on{background:var(--on)}
@media (max-width:760px){#main-content #map.rail:not(.sheet){display:none}}
/* a phone: the pane switch on its own row, wide targets, then the search, then the counts */
@media (max-width:800px){.xbar{flex:1 1 100%;margin:0 0 6px;flex-wrap:wrap;white-space:normal}
  .seg{flex:1 1 0;order:-1;max-width:420px}.seg button{flex:1 1 0;min-height:36px;padding:0 6px}
  .xbar .i{order:-1;width:36px;min-height:36px}
  #sf{flex:1 1 100%}#sq{flex:1 1 0;width:auto;min-height:36px}#sf button{min-height:36px}}
</style>
</head>

(function(){

  h0=location.hash.slice(1).split('&').filter(Boolean),want=new URLSearchParams(location.search).get('view'),

  f.addEventListener('load',function(){Object.keys(late).forEach(function(k){if(k!=='wtid-view'||visible('map'))post(n,late[k]);});
    if(n==='tree')tally(true);if(n==='map'){colour();rail();}});

    var show=v.indexOf(n)>=0,f=frames[n],keep=n==='map'&&innerWidth>760;  // beside a phone the map's frame stays as the rail
    if((show||keep)&&!f)mk(n);

    // what a removed frame sent describes something that is gone
    if(n==='map'){SB.close();delete late['wtid-view'];delete late['wtid-projects'];delete cnt.map;post('space',{type:'wtid-projects',ids:null});}else if(n==='space'){delete late['wtid-keep'];delete cnt.space;post('map',{type:'wtid-keep',ids:null});}}  // a phone holds one view at a time
    else if(f){f.hidden=!show&&!keep;if(show&&old.indexOf(n)<0){sendSel(n,last);post(n,{type:'wtid-record',id:rec});
      Object.keys(late).forEach(function(k){post(n,late[k]);});}}
    });

  var pv=late['wtid-keep'],pcut=pv&&pv.view&&visible('space');  // as does the photo space's

  if(visible('space'))p.push('<b>'+num('space','count')+'</b> <span data-explain="photo-space">in photo space</span>'+(cut?', in map view':''));

document.getElementById('xbar').addEventListener('click',function(e){

  var p=b.dataset.p,on=view.indexOf(p)>=0;

var i=document.getElementById('i'),note=document.getElementById('note');
i.addEventListener('click',function(){note.hidden=!note.hidden;i.setAttribute('aria-expanded',!note.hidden);});
addEventListener('keydown',function(e){if(e.key==='Escape'&&!note.hidden)i.click();});
// Dividers: one between each two shown panes, to drag or move by keys (Shift for more); a double click or Enter
// puts the two back to their defaults. A pane's share of the width is kept as a fraction, so it outlasts a resize.
var MIN={identify:280,map:600,space:320,tree:260},NAME={identify:'Identify',map:'Map',space:'Photo space',tree:'Taxonomy'},sizes={};
try{sizes=JSON.parse(localStorage.getItem('wtid-panes'))||{};}catch(e){}
function vis(){return order.filter(visible);}
function room(){return box.clientWidth-7*Math.max(0,vis().length-1)-(frames.map&&!visible('map')?(railOpen?280:36):0);}
function wide(n){return frames[n].getBoundingClientRect().width;}

  var d={},free=W,open=0;

    else if(n==='tree')free-=d[n]=.3*W;else open++;});

  var v=vis(),W=room(),d=dflt(v,W),f={},t=0;MIN.map=(railOpen?280:36)+320;  // the map beside its rail

  v.forEach(function(n){frames[n].style.flex=f[n]/t*1000+' 1 0';});

  Object.keys(frames).forEach(function(n){frames[n].style.order=n==='map'&&!visible('map')?-1:2*order.indexOf(n);});
  [].forEach.call(box.querySelectorAll('.sep'),function(s){s.remove();});

addEventListener('message',function(e){
  var n=Object.keys(frames).filter(function(k){return frames[k].contentWindow===e.source;})[0],d=e.data;
  if(!n||e.origin!==location.origin||!d||RELAY.indexOf(d.type)<0||d.type==='wtid-view'&&!visible(n))return;
  if(d.type==='wtid-counts'){cnt[n]=d;if(n===src&&visible('tree'))post('tree',d);return;}
  if(d.type==='wtid-record'){if(d.id===rec&&n!=='identify')return;rec=d.id;delete late['wtid-matches'];d=Object.assign({from:n},d);}  // the map opens a card only for Identify's pick
  else if(d.type!=='wtid-focus'&&d.type!=='wtid-reset')late[d.type]=d;
  Object.keys(frames).forEach(function(o){if(o!==n&&visible(o))post(o,d);});
});
// The filter rail is the map's own panel (map_rail.js): its frame stays, the map pane hidden, at the rail's
// width, which the map reports open or folded (wtid-rail); with the map pane hidden the state bar's sheet is
// that frame too (state_bar.js), its rail open.
var railOpen=true,SB=StateBar({frames:frames,visible:visible,post:post,make:function(){mk('map');},rail:function(){rail();}});
function rail(){var f=frames.map;if(!f)return;var on=!visible('map');
  f.classList.toggle('rail',on);f.title=on?'Filters':'Map';if(!on)f.classList.remove('sheet');SB.send();
  post('map',f.classList.contains('sheet')?{type:'wtid-rail',only:on,open:true}:{type:'wtid-rail',only:on});}
addEventListener('message',function(e){
  var d=e.data;
  if(e.origin!==location.origin||!frames.map||e.source!==frames.map.contentWindow||!d||d.type!=='wtid-rail'||typeof d.open!=='boolean')return;
  railOpen=d.open;if(d.shut&&frames.map.classList.contains('sheet'))SB.close();
  layout();
});
function tally(force){var s=visible('map')?'map':visible('space')?'space':null;
  if(visible('tree')&&(force||s!==src)){src=s;post('tree',cnt[s]||{type:'wtid-counts',own:null});}}
// Photo search: the query is resolved as search.html does, and its hits go to both frames as a subset of the points.
var sub=null,sq=document.getElementById('sq'),sm=document.getElementById('sm'),idx=null,enc=null,run=0,
  DATA=new URL(__DATA_URL__,location.href).href.replace(/\/*$/,'/');
function setSub(ids,label){
  sub=ids?{type:'wtid-subset',ids:ids,label:label}:null;
  if(sub)late['wtid-subset']=sub;else delete late['wtid-subset'];  // a frame made or shown later gets it with the rest
  ['identify','map','space'].forEach(function(n){post(n,sub||{type:'wtid-subset',ids:null});});}
async function hitsFor(st){
  idx=idx||AtlasSearchIndex.open(DATA,{whole:4<<20});idx.catch(function(){idx=null;});  // a failed open is retried next time
  if(st.kind==='id')return (await (await idx).neighbors(st.id))||[];
  var q=await (await idx).taxonVector(st.text);  // a taxon name has a precomputed vector: no model, no download
  if(!q){
    enc=enc||window.AtlasEncoderOverride;
    if(!enc){
      var mf=(await idx).manifest,spec=mf.text_encoder;
      if(!spec)throw new Error('this index has no text search model yet');
      if(!await AtlasEncoder.isCached(new URL(spec.onnx,DATA).href)&&!confirm('Text search needs a search model. '+
        'Downloading search model, about '+AtlasEncoder.megabytes(spec)+' MB, once. It is stored in this browser afterwards. '+
        'Searching by observation link needs no download.'))return null;
      sm.textContent='Downloading search model…';
      enc=await AtlasEncoder.load(mf,DATA,{});
    }
    q=await enc.encode(/^(an? )?(photo|picture|image)\b/i.test(st.text)?st.text:'a photo of '+st.text);
  }
  return (await idx).search(q,{k:200});
}
async function photos(){
  var st=AtlasSearchMeta.parseInput(sq.value),r=++run;
  if(!st){sm.textContent='';setSub(null);return;}
  sm.textContent='Searching…';
  try{
    var hits=await hitsFor(st);
    if(r!==run)return;
    if(!hits){sm.textContent='';return;}
    sm.textContent=hits.length?'':'No matching photos.';
    if(hits.length)setSub(hits.map(function(h){return h.id;}),st.kind==='id'?'like '+st.id:st.text);
  }catch(err){if(r===run)sm.textContent='Search failed: '+err.message;}
}
// One box, three kinds of pick: what the map frame offers for the text (taxa, places, a user or project; wtid-suggest,
// answered with rows) and, always last, the photo search. A row is applied by the map (wtid-apply); with no map
// frame, or before it answers, only the photo option shows. An exact name match comes first and is highlighted,
// else the photo option is, so a free sentence plus Enter is the photo search as before.
var sg=document.getElementById('sg'),opts=[],act=-1,seq=0;
function hideSg(){sg.hidden=true;opts=[];act=-1;sq.setAttribute('aria-expanded','false');sq.removeAttribute('aria-activedescendant');}
function markSg(){[].forEach.call(sg.children,function(li,k){li.setAttribute('aria-selected',String(k===act));});
  if(act>=0)sq.setAttribute('aria-activedescendant','sg'+act);else sq.removeAttribute('aria-activedescendant');}
function drawSg(rows,q){
  opts=rows.filter(function(r){return r.exact;}).concat(rows.filter(function(r){return !r.exact;}));
  opts.push({group:'Photos',label:'Photos like \u201c'+q+'\u201d',photo:true});
  act=opts[0].exact?0:opts.length-1;sg.textContent='';
  opts.forEach(function(r,k){var li=document.createElement('li'),g=li.appendChild(document.createElement('i')),
    b=li.appendChild(document.createElement('b')),sp=li.appendChild(document.createElement('span'));
    g.textContent=r.group;b.textContent=r.label;
    sp.textContent=[r.sub,r.count?r.count.toLocaleString('en-CA')+(r.count===1?' record':' records'):''].filter(Boolean).join(' · ');
    sp.hidden=!sp.textContent;li.id='sg'+k;li.setAttribute('role','option');
    li.onpointerdown=function(e){e.preventDefault();pickSg(k);};sg.appendChild(li);});
  sg.hidden=false;sq.setAttribute('aria-expanded','true');markSg();}
function askSg(){
  var q=sq.value.trim(),st=AtlasSearchMeta.parseInput(sq.value),n=++seq;
  if(!q||!st){hideSg();return;}
  drawSg([],q);  // the photo option at once; the map's rows join it when they arrive
  if(st.kind!=='id'&&frames.map&&frames.map.contentWindow)post('map',{type:'wtid-suggest',q:q,seq:n});}
function pickSg(k){var r=opts[k];if(!r)return;hideSg();
  if(r.photo){photos();return;}
  ++seq;post('map',{type:'wtid-apply',group:r.group,key:r.key});sq.value='';}
addEventListener('message',function(e){
  var d=e.data;
  if(e.origin!==location.origin||!frames.map||e.source!==frames.map.contentWindow||!d||d.type!=='wtid-suggest'||
    d.seq!==seq||!Array.isArray(d.rows)||sg.hidden)return;
  drawSg(d.rows.filter(function(r){return r&&typeof r.group==='string'&&typeof r.key==='string'&&typeof r.label==='string';})
    .map(function(r){return {group:r.group,key:r.key,label:r.label,sub:typeof r.sub==='string'?r.sub:'',count:+r.count||0,exact:!!r.exact};}),
    sq.value.trim());
});
sq.addEventListener('input',askSg);sq.addEventListener('focus',askSg);sq.addEventListener('blur',hideSg);
sq.addEventListener('keydown',function(e){
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(sg.hidden)askSg();if(!opts.length)return;
    act=(act+(e.key==='ArrowDown'?1:opts.length-1))%opts.length;markSg();e.preventDefault();}
  else if(e.key==='Enter'){if(!sg.hidden&&act>=0){pickSg(act);e.preventDefault();}}
  else if(e.key==='Escape')hideSg();});
document.getElementById('sf').addEventListener('submit',function(e){e.preventDefault();hideSg();photos();});
sq.addEventListener('input',function(){if(!sq.value&&sub){++run;sm.textContent='';setSub(null);}});  // the field's own clear button
// A chip's remove action in either frame clears the subset.
addEventListener('message',function(e){
  var d=e.data;
  if(e.origin===location.origin&&d&&d.type==='wtid-subset'&&d.ids===null&&Object.keys(frames).some(function(k){
    return frames[k].contentWindow===e.source;})){++run;sq.value='';sm.textContent='';setSub(null);}
});
// Back and forward: the new selection goes to both.
addEventListener('hashchange',function(){var s=MapFilter.tokens(location.hash);
  if(s!==last){last=s;Object.keys(frames).forEach(function(n){if(live(n))sendSel(n,s);});}});
setView(v0);
})();
</script>
