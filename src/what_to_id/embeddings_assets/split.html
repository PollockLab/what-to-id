<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explore: map and photo space</title>
<style>
__SITE_CSS__
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column}
.site-shell{flex-wrap:wrap;position:relative}
.site-nav{flex:0 1 auto}
.xbar{display:flex;align-items:center;gap:8px 14px;margin-left:auto;font-size:13px;white-space:nowrap}
.counts{color:var(--muted)}
.counts b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
#sf{display:inline-flex;gap:6px}
#sq{font:inherit;font-size:13px;width:min(260px,30vw);min-height:28px;padding:0 10px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink)}
#sf button{font:inherit;font-size:12px;min-height:28px;padding:0 11px;border:1px solid var(--line);border-radius:14px;background:var(--chip);color:var(--ink);cursor:pointer}
.seg{display:inline-flex}
.seg button,.xbar .i{font:inherit;font-size:12px;min-height:28px;padding:0 11px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.seg button:first-child{border-radius:14px 0 0 14px}
.seg button:last-child{border-radius:0 14px 14px 0}
.seg button+button{border-left:0}
.seg button[aria-pressed="true"]{background:var(--on);color:var(--onink);border-color:var(--on);font-weight:650}
.seg button[aria-pressed="true"]+button[aria-pressed="true"]{border-left:1px solid var(--bg)}  /* shown panes stay told apart */
.xbar .i{border-radius:50%;width:28px;padding:0;font-style:italic;font-weight:700;font-family:Georgia,serif}
.note{position:absolute;z-index:30;top:100%;right:16px;width:min(380px,calc(100vw - 24px));margin:6px 0 0;padding:10px 12px;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);font-size:12px;color:var(--muted);white-space:normal}
.note[hidden]{display:none}
#main-content{flex:1 1 0;min-height:0;display:flex;overflow-x:auto}
#main-content iframe{flex:1 1 0;min-width:0;height:100%;border:0;background:var(--bg)}
#main-content iframe[hidden]{display:none}
#main-content #identify{min-width:280px}
#main-content #map,#main-content #space{min-width:320px}
#main-content #tree{min-width:260px}
#main-content.drag iframe{pointer-events:none}
.sep{flex:0 0 7px;cursor:col-resize;background:var(--line);touch-action:none;outline-offset:-2px}
.sep:hover,.sep:focus-visible,.sep.on{background:var(--on)}
/* a phone: the pane switch on its own row, wide targets, then the search, then the counts */
@media (max-width:800px){.xbar{flex:1 1 100%;margin:0 0 6px;flex-wrap:wrap;white-space:normal}
  .seg{flex:1 1 0;order:-1;max-width:420px}.seg button{flex:1 1 0;min-height:36px;padding:0 6px}
  .xbar .i{order:-1;width:36px;min-height:36px}
  #sf{flex:1 1 100%}#sq{flex:1 1 0;width:auto;min-height:36px}#sf button{min-height:36px}}
</style>
</head>
<body>
__SITE_NAV__
<div id="main-content" tabindex="-1"></div>
<script>
__MAP_FILTER__
__CLIP_TOKENIZER__
__ATLAS_SEARCH_INDEX__
__ATLAS_SEARCH_META__
__ATLAS_SEARCH_ENCODER__
(function(){
var box=document.getElementById("main-content"),frames={},last=MapFilter.tokens(location.hash),
  h0=location.hash.slice(1).split('&').filter(Boolean),want=new URLSearchParams(location.search).get('view'),
  FILES={identify:__IDENTIFY_FILE__,map:__MAP_FILE__,space:__SPACE_FILE__,tree:__TREE_FILE__},view,
  ORDER=['identify','map','space','tree'],ALIAS={side:'map-space',tree:'map-tree'},
  rest=h0.filter(function(t){return MapFilter.tokens(t)==='';});
if(!FILES.tree)delete FILES.tree;  // a site built without the taxon tree
if(!FILES.identify)delete FILES.identify;  // or without the Identify page
// The view is the panes shown, left to right as in ORDER, written as their names joined by '-'. The old
// one-word views still read; a tree alone is tree-only, since a bare tree is the old Map + tree.
function parse(s){var p=String(ALIAS[s]||s||'').split('-');
  return ORDER.filter(function(n){return FILES[n]&&p.indexOf(n)>=0;});}
function serialize(v){var s=v.join('-');return s==='tree'?'tree-only':s;}
var v0=parse(want);if(!v0.length)v0=FILES.identify?['identify','map']:FILES.tree?['map','tree']:innerWidth>=1280?['map','space']:['map'];
// Tokens the sync leaves alone (the area, parks, camera, an open photo) go to the frame they belong to, once.
function hashFor(n){
  var own=rest.filter(function(t){var k=t.split('=')[0];
    if(k==='id')return true;
    if(k==='life'||k==='clade')return n==='space';
    if(k==='at')return n===(v0.indexOf('map')<0?'space':'map');
    return n==='map';});
  return (last?[last]:[]).concat(own.map(function(t){
    return n==='map'&&t.indexOf('id=')===0?'record='+t.slice(3):t;})).join('&');}
// The address: the shared selection, then the photo space's map of life view.
function life(t){var k=t.split('=')[0];return k==='life'||k==='clade';}
function addr(){var h=(last?[last]:[]).concat(rest.filter(life));history.replaceState(null,'',location.search+(h.length?'#'+h.join('&'):''));}
function visible(n){return frames[n]&&!frames[n].hidden;}
function post(n,m){if(frames[n]&&frames[n].contentWindow)frames[n].contentWindow.postMessage(m,location.origin);}
function sendSel(n,sel){post(n,{type:'wtid-selection',sel:sel});}
function mk(n){
  var f=document.createElement('iframe');f.id=n;f.title={identify:'Identify',map:'Map',space:'Photo space',tree:'Tree of life'}[n];
  f.src=new URL(FILES[n],location.href).href.replace(/#.*/,'')+'?embed=1'+(n==='space'&&view.indexOf('map')>=0?'&peer=1':'')+'#'+hashFor(n);
  // what the other frame sent while this one was still loading
  f.addEventListener('load',function(){Object.keys(late).forEach(function(k){if(k!=='wtid-view'||visible('map'))post(n,late[k]);});
    if(n==='tree')tally(true);});
  // in ORDER in the page too, so the keys move through the panes as they are seen
  box.insertBefore(f,ORDER.slice(ORDER.indexOf(n)+1).map(function(k){return frames[k];}).filter(Boolean)[0]||null);frames[n]=f;}
function setView(v){
  if(innerWidth<800&&v.length>1)v=[v.indexOf('identify')>=0?'identify':v.indexOf('tree')>=0?'tree':v[0]];  // a phone holds one pane, Identify first
  view=v;
  var tree0=visible('tree');
  Object.keys(FILES).forEach(function(n){
    var show=v.indexOf(n)>=0,f=frames[n];
    if(show&&!f)mk(n);
    else if(f&&!show&&innerWidth<800){f.remove();delete frames[n];
    // what a removed frame sent describes something that is gone
    if(n==='map'){delete late['wtid-view'];delete late['wtid-projects'];delete cnt.map;post('space',{type:'wtid-projects',ids:null});}else if(n==='space'){delete late['wtid-keep'];delete cnt.space;post('map',{type:'wtid-keep',ids:null});}}  // a phone holds one view at a time
    else if(f){var was=f.hidden;f.hidden=!show;if(show&&was){sendSel(n,last);post(n,{type:'wtid-record',id:rec});
      Object.keys(late).forEach(function(k){post(n,late[k]);});}}
    });
  // a hidden map masks nothing; a re-shown one fires no moveend, so its last view goes again
  ['space','identify'].forEach(function(n){
    if(!visible('map'))post(n,{type:'wtid-view',area:''});else if(late['wtid-view'])post(n,late['wtid-view']);});
  layout();
  post('space',{type:'wtid-layout',peer:visible('map')&&visible('space')});
  tally(!tree0&&visible('tree'));
  [].forEach.call(document.querySelectorAll('[data-p]'),function(b){b.setAttribute('aria-pressed',v.indexOf(b.dataset.p)>=0);});
  count();}
function num(n,id){
  try{var m=/^[\d,]+/.exec(frames[n].contentDocument.getElementById(id).textContent);return m?m[0]:'…';}catch(e){return '…';}}
function count(){
  var vw=late['wtid-view'],cut=vw&&vw.area&&visible('map');  // the view narrows both counts
  var pv=late['wtid-keep'],pcut=pv&&pv.view&&visible('space');  // as does the photo space's
  var p=[];if(visible('identify'))p.push('<b>'+num('identify','status')+'</b> to identify');  // its status line starts with the kept count
  if(visible('map'))p.push('<b>'+num('map','count')+'</b> on map'+(cut?visible('identify')?', both in view':', in view':'')+(pcut?', in photo view':''));
  if(visible('space'))p.push('<b>'+num('space','count')+'</b> in photo space'+(cut?', in map view':''));
  var c=document.getElementById('counts'),h=p.join(' · ');if(c.innerHTML!==h)c.innerHTML=h;}
setInterval(count,400);
document.getElementById('xbar').addEventListener('click',function(e){
  var b=e.target.closest('[data-p]');if(!b)return;
  var p=b.dataset.p,on=view.indexOf(p)>=0;
  if(on&&view.length===1)return;  // the last pane stays
  setView(innerWidth<800?[p]:ORDER.filter(function(n){return n===p?!on:view.indexOf(n)>=0;}));
  history.replaceState(null,'','?view='+serialize(view)+location.hash);});
var i=document.getElementById('i'),note=document.getElementById('note');
i.addEventListener('click',function(){note.hidden=!note.hidden;i.setAttribute('aria-expanded',!note.hidden);});
addEventListener('keydown',function(e){if(e.key==='Escape'&&!note.hidden)i.click();});
// Dividers: one between each two shown panes, to drag or move by keys (Shift for more); a double click or Enter
// puts the two back to their defaults. A pane's share of the width is kept as a fraction, so it outlasts a resize.
var MIN={identify:280,map:320,space:320,tree:260},NAME={identify:'Identify',map:'Map',space:'Photos',tree:'Tree'},sizes={};
try{sizes=JSON.parse(localStorage.getItem('wtid-panes'))||{};}catch(e){}
function vis(){return ORDER.filter(visible);}
function room(){return box.clientWidth-7*Math.max(0,vis().length-1);}
function wide(n){return frames[n].getBoundingClientRect().width;}
function dflt(v,W){  // Identify a narrow column, the tree a third, the map and photos share the rest
  var d={},free=W,open=0;
  v.forEach(function(n){if(n==='identify')free-=d[n]=Math.min(440,Math.max(320,.28*W));
    else if(n==='tree')free-=d[n]=.3*W;else open++;});
  v.forEach(function(n){if(d[n]==null)d[n]=Math.max(free,.2*W)/open;});
  return d;}
function layout(){
  var v=vis(),W=room(),d=dflt(v,W),f={},t=0;
  v.forEach(function(n){f[n]=sizes[n]>0&&sizes[n]<1?sizes[n]:d[n]/W;t+=f[n];});
  v.forEach(function(n){frames[n].style.flex=f[n]/t*1000+' 1 0';});
  [].forEach.call(box.querySelectorAll('.sep'),function(s){s.remove();});
  for(var i=1;i<v.length;i++)box.insertBefore(mkSep(v[i-1],v[i]),frames[v[i]]);}
function mkSep(a,b){
  var s=document.createElement('div'),x0,a0;s.className='sep';s.tabIndex=0;s.setAttribute('role','separator');
  s.setAttribute('aria-orientation','vertical');s.setAttribute('aria-label','Resize '+NAME[a]+' and '+NAME[b]);
  s.setAttribute('aria-valuemin',0);s.setAttribute('aria-valuemax',100);
  function now(){s.setAttribute('aria-valuenow',Math.round(wide(a)/(wide(a)+wide(b))*100));}
  function put(wa){  // only a and b change: the rest keep their widths
    var v=vis(),w={},t=0,S=wide(a)+wide(b);
    v.forEach(function(n){w[n]=wide(n);t+=w[n];});
    w[a]=Math.max(MIN[a],Math.min(S-MIN[b],wa));w[b]=S-w[a];
    v.forEach(function(n){sizes[n]=w[n]/t;frames[n].style.flex=sizes[n]*1000+' 1 0';});
    try{localStorage.setItem('wtid-panes',JSON.stringify(sizes));}catch(e){}
    now();}
  function reset(){var d=dflt(vis(),room());put((wide(a)+wide(b))*d[a]/(d[a]+d[b]));}
  function end(){s.classList.remove('on');box.classList.remove('drag');}
  s.addEventListener('pointerdown',function(e){s.setPointerCapture(e.pointerId);x0=e.clientX;a0=wide(a);
    s.classList.add('on');box.classList.add('drag');});
  s.addEventListener('pointermove',function(e){if(s.classList.contains('on'))put(a0+e.clientX-x0);});
  s.addEventListener('pointerup',end);s.addEventListener('pointercancel',end);
  s.addEventListener('dblclick',reset);
  s.addEventListener('keydown',function(e){
    var d={ArrowLeft:-1,ArrowRight:1}[e.key];
    if(d){put(wide(a)+d*(e.shiftKey?64:16));e.preventDefault();}else if(e.key==='Enter'){reset();e.preventDefault();}});
  s.upd=now;now();return s;}
addEventListener('resize',function(){[].forEach.call(box.querySelectorAll('.sep'),function(s){s.upd();});});
// A frame reports its selection; the others apply it in place. The frames never reload.
addEventListener('message',function(e){
  var n=Object.keys(frames).filter(function(k){return frames[k].contentWindow===e.source;})[0];
  if(!n||e.origin!==location.origin||!e.data||e.data.type!=='wtid-selection'||typeof e.data.sel!=='string'||
    e.data.sel===last)return;
  last=e.data.sel;Object.keys(frames).forEach(function(o){if(o!==n&&visible(o))sendSel(o,last);});
  addr();
});
// The photo space's view tokens (life=look, clade=), kept for a reload, a shared link and a frame made later.
addEventListener('message',function(e){
  var d=e.data;
  if(e.origin!==location.origin||!frames.space||e.source!==frames.space.contentWindow||!d||d.type!=='wtid-life'||
    !Array.isArray(d.tokens))return;
  var t=d.tokens.filter(function(x){return typeof x==='string'&&life(x);});
  if(t.join('&')===rest.filter(life).join('&'))return;
  rest=rest.filter(function(x){return !life(x);}).concat(t);addr();
});
// A picked record and its closest matches are mirrored by id in the other frame, as are the map's area and
// the photo space's lasso, to every other frame shown; the last of each (late) also goes to a frame that shows up later.
// The counts per taxon go to the tree: the map's, or the photo space's when the map is hidden; with neither, none.
var rec=null,late={},cnt={},src,RELAY=['wtid-record','wtid-matches','wtid-focus','wtid-area','wtid-view','wtid-keep','wtid-projects','wtid-reset','wtid-counts'];
addEventListener('message',function(e){
  var n=Object.keys(frames).filter(function(k){return frames[k].contentWindow===e.source;})[0],d=e.data;
  if(!n||e.origin!==location.origin||!d||RELAY.indexOf(d.type)<0||d.type==='wtid-view'&&!visible(n))return;
  if(d.type==='wtid-counts'){cnt[n]=d;if(n===src&&visible('tree'))post('tree',d);return;}
  if(d.type==='wtid-record'){if(d.id===rec)return;rec=d.id;delete late['wtid-matches'];}
  else if(d.type!=='wtid-focus'&&d.type!=='wtid-reset')late[d.type]=d;
  Object.keys(frames).forEach(function(o){if(o!==n&&visible(o))post(o,d);});
});
function tally(force){var s=visible('map')?'map':visible('space')?'space':null;
  if(visible('tree')&&(force||s!==src)){src=s;post('tree',cnt[s]||{type:'wtid-counts',own:null});}}
// Photo search: the query is resolved as search.html does, and its hits go to both frames as a subset of the points.
var sub=null,sq=document.getElementById('sq'),sm=document.getElementById('sm'),idx=null,enc=null,run=0,
  DATA=new URL(__DATA_URL__,location.href).href.replace(/\/*$/,'/');
function setSub(ids,label){
  sub=ids?{type:'wtid-subset',ids:ids,label:label}:null;
  if(sub)late['wtid-subset']=sub;else delete late['wtid-subset'];  // a frame made or shown later gets it with the rest
  ['identify','map','space'].forEach(function(n){post(n,sub||{type:'wtid-subset',ids:null});});}
async function hitsFor(st){
  idx=idx||AtlasSearchIndex.open(DATA,{whole:4<<20});idx.catch(function(){idx=null;});  // a failed open is retried next time
  if(st.kind==='id')return (await (await idx).neighbors(st.id))||[];
  var q=await (await idx).taxonVector(st.text);  // a taxon name has a precomputed vector: no model, no download
  if(!q){
    enc=enc||window.AtlasEncoderOverride;
    if(!enc){
      var mf=(await idx).manifest,spec=mf.text_encoder;
      if(!spec)throw new Error('this index has no text search model yet');
      if(!await AtlasEncoder.isCached(new URL(spec.onnx,DATA).href)&&!confirm('Text search needs a search model. '+
        'Downloading search model, about '+AtlasEncoder.megabytes(spec)+' MB, once. It is stored in this browser afterwards. '+
        'Searching by observation link needs no download.'))return null;
      sm.textContent='Downloading search model…';
      enc=await AtlasEncoder.load(mf,DATA,{});
    }
    q=await enc.encode(/^(an? )?(photo|picture|image)\b/i.test(st.text)?st.text:'a photo of '+st.text);
  }
  return (await idx).search(q,{k:200});
}
document.getElementById('sf').addEventListener('submit',async function(e){
  e.preventDefault();
  var st=AtlasSearchMeta.parseInput(sq.value),r=++run;
  if(!st){sm.textContent='';setSub(null);return;}
  sm.textContent='Searching…';
  try{
    var hits=await hitsFor(st);
    if(r!==run)return;
    if(!hits){sm.textContent='';return;}
    sm.textContent=hits.length?'':'No matching photos.';
    if(hits.length)setSub(hits.map(function(h){return h.id;}),st.kind==='id'?'like '+st.id:st.text);
  }catch(err){if(r===run)sm.textContent='Search failed: '+err.message;}
});
sq.addEventListener('input',function(){if(!sq.value&&sub){++run;sm.textContent='';setSub(null);}});  // the field's own clear button
// A chip's remove action in either frame clears the subset.
addEventListener('message',function(e){
  var d=e.data;
  if(e.origin===location.origin&&d&&d.type==='wtid-subset'&&d.ids===null&&Object.keys(frames).some(function(k){
    return frames[k].contentWindow===e.source;})){++run;sq.value='';sm.textContent='';setSub(null);}
});
// Back and forward: the new selection goes to both.
addEventListener('hashchange',function(){var s=MapFilter.tokens(location.hash);
  if(s!==last){last=s;Object.keys(frames).forEach(function(n){if(visible(n))sendSel(n,s);});}});
setView(v0);
})();
</script>
</body>
</html>
