<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>What to ID next</title>
<style>
__SITE_CSS__
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1180px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0}
a{color:var(--bar)}
.muted{color:var(--muted)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;
  margin:12px 0}
.levels button{font:inherit;color:inherit;cursor:pointer;text-align:left;padding:10px 12px;
  border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.levels button b{display:block;font-size:16px}
.levels button span{color:var(--muted)}
.levels button[aria-pressed="true"]{background:var(--on);color:var(--onink);border-color:var(--on)}
.levels button[aria-pressed="true"] span{color:var(--onink)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tabs button,.more{font:inherit;color:inherit;cursor:pointer}
.tabs button{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:18px;
  background:var(--chip)}
.tabs button[aria-pressed="true"]{background:var(--on);color:var(--onink);border-color:var(--on)}
.act{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:8px 0 12px}
#cards{list-style:none;margin:0;padding:0;display:grid;gap:12px;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;
  display:flex;flex-direction:column;gap:6px}
.card img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:4px;
  background:var(--chip);display:block}
.card .range{font-size:.85em;color:#666}
.card .links{display:flex;flex-wrap:wrap;gap:4px 12px}
.card.wide{grid-column:1/-1}
:root{--rlab:#3b78c4;--rlook:#e08a2c;--rboth:#8a5fb0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rlab:#5b9bea;--rlook:#f0a04b;
  --rboth:#b48ad6}}
:root[data-theme="dark"]{--rlab:#5b9bea;--rlook:#f0a04b;--rboth:#b48ad6}
.rmap{display:flex;flex-direction:column;gap:4px}
.rbtn{all:unset;box-sizing:border-box;display:block;width:min(100%,220px);cursor:zoom-in;
  border-radius:6px}
.rmap.big .rbtn{width:min(100%,560px);cursor:zoom-out}
.rbtn:focus-visible{outline:3px solid var(--bar);outline-offset:2px}
.rbtn canvas{display:block;width:100%;height:auto;border-radius:6px;background:var(--panel);
  border:1px solid var(--line);box-sizing:border-box}
.rleg{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;
  font-size:.8em;color:var(--muted);max-width:220px}
.rmap.big .rleg{max-width:560px}
.rleg li{display:flex;align-items:center;gap:5px;min-width:0}
.rleg .none{grid-column:1/-1;color:var(--ink)}
.sw{flex:none;width:10px;height:10px;border-radius:2px;background:var(--line)}
.sw.lab{background:var(--rlab)}.sw.look{background:var(--rlook)}.sw.both{background:var(--rboth)}
.sw.dot{border-radius:50%;background:#111;box-shadow:0 0 0 2px #fff;width:6px;height:6px;margin:2px}
.more{margin:12px 0;min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:6px;
  background:var(--chip)}
</style></head><body>
__SITE_NAV__<main id="main-content">
<h1>What to ID next</h1>
<p>Pick a level and a group: each card is a Needs ID record chosen by how its photo compares with
the species it is labelled as, so you spend your time where it counts. __BUILT__</p>
<div class="levels" id="levels" role="group" aria-label="Level"></div>
<div class="tabs" id="tabs" role="group" aria-label="Group"></div>
<p id="status" class="muted" aria-live="polite">Loading…</p>
<div class="act" id="act"></div>
<ol id="cards"></ol>
</main>
<script>var CONFIG=__CONFIG__;</script>
<script>__EMBEDDINGS_LAYOUT__</script>
<script>__IDENTIFY_LINKS__</script>
<script>__LEVELS_APP__</script>
</body></html>
