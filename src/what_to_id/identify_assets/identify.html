<style>
__SITE_CSS__
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:0 12px 16px}
h1{font-size:20px;margin:12px 0 4px}
.embed h1{display:none}
a{color:var(--bar)}
.muted{color:var(--muted)}
.about{font-size:13px;margin:6px 0}
.about summary{cursor:pointer;color:var(--muted)}
.about p{margin:6px 0}
#status{margin:6px 0;font-size:13px}
.tabs{position:sticky;top:0;z-index:2;display:flex;gap:4px;padding:6px 0;background:var(--bg);
  border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 6px;
  font:inherit;font-size:12px;line-height:1.2;color:var(--ink);background:var(--chip);
  border:1px solid var(--line);border-radius:8px;cursor:pointer}
.tab b{font-size:14px}
@media (max-width:360px){.tabs{flex-wrap:wrap}.tab{flex:1 1 40%}}  /* a narrow pane: two rows of two, nothing cut off */
.tab[aria-selected=true]{background:var(--on);color:var(--onink);border-color:var(--on)}
.tab.zero:not([aria-selected=true]){opacity:.55}
[hidden]{display:none!important}  /* .batch and the arrows set display, which would beat hidden */
#none button{font:inherit;color:var(--ink);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
#desc{margin:6px 0 2px;font-size:12px}
.batch{display:flex;align-items:center;gap:6px;margin:8px 0}  /* one row: the arrows stay beside the link */
.batch .muted{font-size:12px}
.arrow{font:inherit;min-width:32px;min-height:32px;cursor:pointer;color:var(--ink);
  border:1px solid var(--line);border-radius:6px;background:var(--chip)}
.arrow:disabled{opacity:.4;cursor:default}
ol{list-style:none;margin:8px 0;padding:0;display:grid;gap:10px;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;
  display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer}
.card:hover{border-color:var(--muted)}
.card .ph{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;font-size:12px;
  border-radius:4px;background:var(--chip);color:var(--muted);overflow:hidden;text-align:center}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .name,.card .com,.card .when{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .name{font-size:13px}
.card .com,.card .look,.card .when{font-size:12px;color:var(--muted)}
.card .look{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .when{display:block;text-decoration:none;min-height:1.4em}
.card .when:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:15px;
  background:var(--on);color:var(--onink);font-size:13px;font-weight:650;text-decoration:none}
.card .btn{align-self:flex-start}
.more{font:inherit;color:inherit;cursor:pointer;min-height:36px;padding:0 14px;
  border:1px solid var(--line);border-radius:6px;background:var(--chip)}
#end{text-align:center;margin:8px 0}
.rout{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:6px 0;font-size:12px}
.out{font:inherit;color:var(--ink);cursor:pointer;min-height:30px;padding:0 12px;border:1px solid var(--line);
  border-radius:15px;background:var(--chip)}
.out[aria-pressed=true]{background:var(--on);color:var(--onink);border-color:var(--on)}
.out.not{background:var(--warnbg);color:var(--warn);border:1px dashed var(--warn)}
.out:disabled{opacity:.5;cursor:default}
.card .links{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.card .range{flex:1 1 8em;min-width:0;font-size:12px;color:var(--muted)}
:root{--rlab:#3b78c4;--rlook:#d97a12;--rboth:#8a5fb0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rlab:#5b9bea;--rlook:#f0a04b;--rboth:#b48ad6}}
:root[data-theme="dark"]{--rlab:#5b9bea;--rlook:#f0a04b;--rboth:#b48ad6}
.rchip{flex:1 1 8em;min-width:0;display:inline-flex;align-items:center;gap:5px;font:inherit;
  font-size:12px;min-height:24px;padding:0;border:0;background:none;color:var(--muted);
  cursor:pointer;max-width:100%;text-align:left;text-decoration:underline dotted;text-underline-offset:3px}
.rchip svg{flex:none}
.rchip.bad{color:var(--share)}
.rchip[aria-expanded="true"]{text-decoration-style:solid}
.rpop{position:fixed;z-index:20;width:340px;max-width:calc(100vw - 16px);box-sizing:border-box;padding:12px;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.rpop canvas{display:block;width:100%;height:auto;margin-top:22px;border-radius:6px;
  border:1px solid var(--line);box-sizing:border-box}
.rx{position:absolute;top:2px;right:2px;width:32px;height:32px;font:inherit;font-size:20px;
  line-height:1;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:16px}
.rleg{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:2px 12px;
  font-size:12px;color:var(--muted)}
.rleg li{display:flex;align-items:center;gap:5px}
.rcap{margin:6px 0 0;font-size:13px}
.sw{flex:none;width:10px;height:10px;border-radius:2px;background:var(--line)}
.sw.lab{background:var(--rlab)}.sw.look{background:var(--rlook)}.sw.both{background:var(--rboth)}
.sw.dot{border-radius:50%;background:#111;box-shadow:0 0 0 2px #fff;width:6px;height:6px;margin:2px}
@media (max-width:599px) and (hover:none){.rpop{left:0;right:0;bottom:0;top:auto;width:auto;max-width:none;max-height:85vh;
  overflow:auto;border-radius:14px 14px 0 0;padding-bottom:20px}}
</style></head><body>
__SITE_NAV__<main id="main-content">
<h1>Identify</h1>
<details class="about"><summary>About</summary>
<p>Needs ID records in four groups by how their photo compares with the species they are labelled as,

so they are not listed.</p></details>

<p id="rout" class="rout" hidden><button type="button" id="out" class="out"></button><span id="left" class="muted" aria-live="polite"></span></p>
<div id="panel" role="tabpanel">
<div id="batch" class="batch" hidden><a id="go" class="btn" target="_blank" rel="noopener"></a>
<button type="button" id="prev" class="arrow" aria-label="Previous batch">‹</button>
<span id="step" class="muted"></span>
<button type="button" id="next" class="arrow" aria-label="Next batch">›</button></div>
<p id="none" class="muted" hidden>No records at this level here.</p>
<ol id="grid"></ol>
<p id="end"><button type="button" id="more" class="more" hidden></button></p>
</div>
</main>
